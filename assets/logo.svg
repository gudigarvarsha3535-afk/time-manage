<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#primaryGrad)" stroke-width="6" opacity="0.4"/>

  <!-- Outer 24h dial track -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1f293d" stroke-width="16"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#primaryGrad)" stroke-width="16" stroke-dasharray="1131" stroke-dashoffset="300" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Hour notches -->
  <g stroke="#475569" stroke-width="3" opacity="0.6">
    <line x1="256" y1="92" x2="256" y2="108" />
    <line x1="256" y1="404" x2="256" y2="420" />
    <line x1="92" y1="256" x2="108" y2="256" />
    <line x1="404" y1="256" x2="420" y2="256" />
    <line x1="140" y1="140" x2="152" y2="152" />
    <line x1="372" y1="140" x2="360" y2="152" />
    <line x1="140" y1="372" x2="152" y2="360" />
    <line x1="372" y1="372" x2="360" y2="360" />
  </g>

  <!-- Center core: Lightning / Rocket / 24H symbol -->
  <circle cx="256" cy="256" r="120" fill="#0f172a" stroke="#334155" stroke-width="4"/>
  
  <!-- 24 Text -->
  <text x="256" y="220" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">24H</text>
  
  <!-- Pulse Lightning Bolt -->
  <path d="M260 236 L232 290 L254 290 L246 336 L284 274 L262 274 Z" fill="url(#primaryGrad)" filter="url(#glow)"/>

  <!-- Milestone Dots -->
  <circle cx="256" cy="76" r="8" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="436" cy="256" r="8" fill="#8b5cf6" filter="url(#glow)"/>
  <circle cx="256" cy="436" r="8" fill="#10b981" filter="url(#glow)"/>
  <circle cx="76" cy="256" r="8" fill="#f59e0b" filter="url(#glow)"/>
</svg>
